name: Build Tech Browse APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Agar TechBrowse.zip repo mein upload ki hai, to GitHub use yahin unzip karega.
      # Agar project files pehle se repo mein hain, to yeh step bas unhe dhoondhta hai.
      - name: Find project (unzip automatically if needed)
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -q -o "$ZIP" -d _src
          fi
          FILE=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found. Upload TechBrowse.zip or the project files to the repo root."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/debug/app-debug.apk TechBrowse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TechBrowse-APK
          path: TechBrowse.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tech Browse build ${{ github.run_number }}
          files: TechBrowse.apk
